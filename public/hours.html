<title>Weekly Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f3f5f8;
    --card: #ffffff;
    --ink: #17212e;
    --muted: #5d6a7b;
    --line: #dde3eb;
    --accent: #1f4f8a;
    --accent-soft: #e4edf8;
    --money: #237a4b;
    --money-soft: #e3f3ea;
    --off: #eef1f5;
    --sans: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f141b; --card: #171e28; --ink: #e8edf4; --muted: #95a3b6;
      --line: #273242; --accent: #7fb0ea; --accent-soft: #1c2c42;
      --money: #5fd192; --money-soft: #143023; --off: #131a23;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f141b; --card: #171e28; --ink: #e8edf4; --muted: #95a3b6;
    --line: #273242; --accent: #7fb0ea; --accent-soft: #1c2c42;
    --money: #5fd192; --money-soft: #143023; --off: #131a23;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 20px; }
  h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .rate { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .rate input { width: 72px; }

  .week-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .week-nav strong { font-size: 16px; text-align: center; flex: 1; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 8px 12px; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .link { border: none; background: none; color: var(--accent); padding: 4px 6px; font-size: 13px; font-weight: 600; }

  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile.pay { background: var(--money-soft); border-color: transparent; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  .big { font-family: var(--mono); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .pay .big { color: var(--money); }

  .days { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .day { display: grid; grid-template-columns: 1fr auto 84px; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .day:first-child { border-top: none; }
  .day.offday { background: var(--off); }
  .day .name { font-weight: 600; }
  .day .date { color: var(--muted); font-size: 12px; }
  .chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .chip.none { background: transparent; color: var(--muted); font-weight: 400; }
  .day .earn { font-family: var(--mono); font-size: 12px; color: var(--money); font-variant-numeric: tabular-nums; }
  input[type=number] { font-family: var(--mono); font-size: 16px; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }

  .history h2 { font-size: 14px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { color: var(--accent); }
  .status { font-size: 12px; color: var(--muted); text-align: center; min-height: 18px; }
  @media (max-width: 400px) { .big { font-size: 24px; } .day { grid-template-columns: 1fr 76px; } .day .chip { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Weekly Hours</h1>
      <p class="sub">Regular days: Mon, Tue, Fri</p>
    </div>
    <label class="rate" for="rate">Rate $<input id="rate" type="number" min="0" step="0.25" value="25"> /hr</label>
  </header>

  <div class="week-nav">
    <button id="prev" aria-label="Previous week">&larr;</button>
    <strong id="weekLabel">This week</strong>
    <button id="next" aria-label="Next week">&rarr;</button>
  </div>

  <div class="summary">
    <div class="tile"><div class="label">Hours this week</div><div class="big" id="totHours">0</div></div>
    <div class="tile pay"><div class="label">Pay this week</div><div class="big" id="totPay">$0.00</div></div>
  </div>

  <div class="days" id="days"></div>
  <p class="hint">Type hours as decimals: 3.5 = 3 hrs 30 min, 3.25 = 3 hrs 15 min. Leave blank if you didn't work. Changes save automatically.</p>
  <div class="status" id="status"></div>

  <section class="history">
    <h2>Past weeks</h2>
    <table>
      <thead><tr><th>Week of</th><th class="num">Hours</th><th class="num">Pay</th></tr></thead>
      <tbody id="hist"></tbody>
    </table>
  </section>
</div>

<script>
(function () {
  const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
  const REGULAR = [true, true, false, false, true];
  const LS_KEY = "weekly-hours-v1";

  let entries = {};      // "YYYY-MM-DD" -> hours
  let rate = 25;
  let weekStart = mondayOf(new Date());
  let db = null;
  const timers = {};

  function pad(n) { return String(n).padStart(2, "0"); }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function mondayOf(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const dow = (x.getDay() + 6) % 7; // Mon=0
    x.setDate(x.getDate() - dow);
    return x;
  }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function fmtShort(d) { return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
  function money(n) { return "$" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function hrs(n) { return (Math.round(n * 100) / 100).toString(); }

  function status(msg) { document.getElementById("status").textContent = msg; }

  // local fallback
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const o = JSON.parse(raw); entries = o.entries || {}; rate = o.rate ?? 25; }
    } catch (e) {}
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ entries, rate })); } catch (e) {}
  }

  function weekTotal(start) {
    let t = 0;
    for (let i = 0; i < 5; i++) t += Number(entries[iso(addDays(start, i))] || 0);
    return t;
  }

  function renderDays() {
    const box = document.getElementById("days");
    box.innerHTML = "";
    const todayIso = iso(new Date());
    for (let i = 0; i < 5; i++) {
      const d = addDays(weekStart, i);
      const key = iso(d);
      const val = entries[key];
      const row = document.createElement("div");
      row.className = "day" + (REGULAR[i] ? "" : " offday");
      const left = document.createElement("div");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = DAYS[i] + (key === todayIso ? " · today" : "");
      const sub = document.createElement("div");
      sub.className = "date";
      sub.textContent = fmtShort(d);
      const earn = document.createElement("span");
      earn.className = "earn";
      earn.id = "earn-" + key;
      earn.textContent = val ? "  " + money(val * rate) : "";
      sub.appendChild(earn);
      left.append(name, sub);
      const chip = document.createElement("span");
      chip.className = "chip" + (REGULAR[i] ? "" : " none");
      chip.textContent = REGULAR[i] ? "Regular day" : "Off";
      const input = document.createElement("input");
      input.type = "number"; input.min = "0"; input.max = "24"; input.step = "0.25";
      input.inputMode = "decimal";
      input.id = "h-" + key;
      input.placeholder = "0";
      input.setAttribute("aria-label", DAYS[i] + " hours");
      if (val) input.value = val;
      input.addEventListener("input", () => onHours(key, input.value));
      row.append(left, chip, input);
      box.appendChild(row);
    }
  }

  function renderTotals() {
    const t = weekTotal(weekStart);
    document.getElementById("totHours").textContent = hrs(t);
    document.getElementById("totPay").textContent = money(t * rate);
    for (let i = 0; i < 5; i++) {
      const key = iso(addDays(weekStart, i));
      const el = document.getElementById("earn-" + key);
      if (el) el.textContent = entries[key] ? "  " + money(entries[key] * rate) : "";
    }
  }

  function renderWeekLabel() {
    const end = addDays(weekStart, 4);
    const thisMon = iso(mondayOf(new Date()));
    const prefix = iso(weekStart) === thisMon ? "This week · " : "";
    document.getElementById("weekLabel").textContent = prefix + fmtShort(weekStart) + " – " + fmtShort(end);
  }

  function renderHistory() {
    const weeks = {};
    for (const k of Object.keys(entries)) {
      if (!entries[k]) continue;
      const [y, m, d] = k.split("-").map(Number);
      const mon = iso(mondayOf(new Date(y, m - 1, d)));
      weeks[mon] = true;
    }
    const tb = document.getElementById("hist");
    tb.innerHTML = "";
    const keys = Object.keys(weeks).sort().reverse();
    if (!keys.length) {
      tb.innerHTML = '<tr><td colspan="3" style="color:var(--muted)">No hours logged yet.</td></tr>';
      return;
    }
    for (const k of keys) {
      const [y, m, d] = k.split("-").map(Number);
      const start = new Date(y, m - 1, d);
      const t = weekTotal(start);
      const tr = document.createElement("tr");
      tr.className = "clickable";
      tr.innerHTML = "<td></td><td class='num'></td><td class='num'></td>";
      tr.children[0].textContent = fmtShort(start);
      tr.children[1].textContent = hrs(t);
      tr.children[2].textContent = money(t * rate);
      tr.addEventListener("click", () => { weekStart = start; renderAll(); window.scrollTo({ top: 0 }); });
      tb.appendChild(tr);
    }
  }

  function renderAll() {
    renderWeekLabel(); renderDays(); renderTotals(); renderHistory();
    document.getElementById("rate").value = rate;
  }

  function onHours(key, raw) {
    const n = raw === "" ? 0 : Math.max(0, Math.min(24, Number(raw)));
    if (Number.isNaN(n)) return;
    if (n) entries[key] = n; else delete entries[key];
    renderTotals(); renderHistory(); saveLocal();
    clearTimeout(timers[key]);
    timers[key] = setTimeout(() => persistDay(key), 600);
  }

  async function persistDay(key) {
    if (!db) { status("Saved on this device"); return; }
    try {
      const ref = db.collection("days").doc(key);
      if (entries[key]) await ref.set({ date: key, hours: entries[key] });
      else await ref.delete();
      status("Saved");
    } catch (e) {
      status("Couldn't save. Check your connection and try again.");
    }
  }

  document.getElementById("rate").addEventListener("input", (e) => {
    const n = Number(e.target.value);
    if (Number.isNaN(n) || n < 0) return;
    rate = n; renderTotals(); renderHistory(); saveLocal();
    clearTimeout(timers.__rate);
    timers.__rate = setTimeout(async () => {
      if (!db) return;
      try { await db.doc("settings/main").set({ rate }); status("Saved"); }
      catch (e) { status("Couldn't save the rate."); }
    }, 600);
  });
  document.getElementById("prev").addEventListener("click", () => { weekStart = addDays(weekStart, -7); renderAll(); });
  document.getElementById("next").addEventListener("click", () => { weekStart = addDays(weekStart, 7); renderAll(); });

  loadLocal();
  renderAll();

  // Shared storage when running as a claude.ai artifact
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then((ns) => {
      if (!ns) return;
      db = ns;
      db.collection("days").onSnapshot((snap) => {
        const next = {};
        for (const doc of snap.docs) {
          const d = doc.data();
          if (d && d.hours) next[doc.id] = Number(d.hours);
        }
        const active = document.activeElement && document.activeElement.id;
        entries = next; saveLocal();
        renderAll();
        if (active) { const el = document.getElementById(active); if (el) el.focus(); }
      }, () => status("Live sync stopped. Reload to reconnect."));
      db.doc("settings/main").onSnapshot((s) => {
        if (s.exists && typeof s.data().rate === "number" && document.activeElement?.id !== "rate") {
          rate = s.data().rate; saveLocal(); renderAll();
        }
      });
    }).catch(() => {});
  }
})();
</script>
